<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080b" />
      <stop offset="50%" stop-color="#0f0f18" />
      <stop offset="100%" stop-color="#141424" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f00ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <rect width="600" height="400" fill="url(#glowGrad)" />
  
  <!-- Glowing neon curves -->
  <path d="M-50,320 Q150,120 650,220" fill="none" stroke="#7f00ff" stroke-width="4" filter="url(#glow)" opacity="0.5"/>
  <path d="M-50,260 Q250,390 650,120" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow)" opacity="0.4"/>
  
  <!-- Center Camera Icon -->
  <g transform="translate(300, 175)" stroke="url(#neonGrad)" stroke-width="2" fill="none">
    <!-- Camera Body -->
    <rect x="-65" y="-45" width="130" height="90" rx="12" fill="#08080f" stroke-width="3" filter="url(#glow)"/>
    <!-- Camera Lens -->
    <path d="M65,-22 L98,-38 L98,38 L65,22 Z" fill="#0f0f18" stroke-width="3" />
    <circle cx="82" cy="0" r="12" />
    <!-- Film Reels -->
    <circle cx="-32" cy="-70" r="26" fill="#08080f" stroke-width="3"/>
    <circle cx="-32" cy="-70" r="10" />
    <circle cx="32" cy="-70" r="26" fill="#08080f" stroke-width="3"/>
    <circle cx="32" cy="-70" r="10" />
    <!-- Recording Indicator dot -->
    <circle cx="-42" cy="-22" r="6" fill="#ff007f" stroke="none" />
    <circle cx="-42" cy="-22" r="10" stroke="#ff007f" stroke-width="1.5" opacity="0.5" filter="url(#glow)" />
  </g>
  
  <!-- Typography -->
  <text x="300" y="315" font-family="'Syne', 'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">STUDIO PROMO</text>
  <text x="300" y="340" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="6">PRODUCTION SUITE</text>
</svg>
